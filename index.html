<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fichero de Índices · Repaso de Oposición</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="wrap">

    <header class="masthead">
      <div class="kicker mono">FICHERO DE REPASO</div>
      <h1>Índices del temario</h1>
    </header>

    <!-- Selección de temas -->
    <section class="card">
      <hr class="rule-top">
      <h3>Nº 1 — Selecciona los temas a repasar</h3>

      <div class="topic-toolbar">
        <button id="btn-todos" class="link-btn">marcar todos</button>
        <button id="btn-ninguno" class="link-btn">marcar ninguno</button>
      </div>

      <div id="lista-temas" class="topic-list"></div>

      <div class="btn-row" style="margin-top:20px; display:flex; gap:12px; flex-wrap:wrap;">
        <button id="btn-sortear" class="stamp-btn">🎲 Sortear tema</button>
        <button id="btn-stats" class="plain-btn">📊 Ver estadísticas</button>
      </div>
    </section>

    <!-- Panel de estadísticas -->
    <section id="panel-stats" class="card hidden">
      <hr class="rule-top">
      <h3>Nº 2 — Tu historial de repaso</h3>
      <div id="stats-global" class="stats-global"></div>
      <div id="stats-tabla"></div>
      <div class="btn-row" style="margin-top:16px;">
        <button id="btn-reset-stats" class="link-btn">borrar todas las estadísticas</button>
      </div>
    </section>

    <!-- Zona de estudio -->
    <section id="zona-estudio" class="card hidden">
      <hr class="rule-top">
      <h3 id="tema-numero">Nº — Reconstruye el índice</h3>
      <div class="tema-titulo" id="tema-titulo"></div>
      <div class="tema-meta mono" id="tema-meta"></div>

      <div id="renglones" class="renglones"></div>

      <div class="btn-row" style="margin-top:20px;">
        <button id="btn-validar" class="stamp-btn">✔️ Validar índice</button>
      </div>

      <div id="resumen" class="resumen"></div>
    </section>

  </div>

  <script src="app.js"></script>
</body>
</html>
